<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Esku">
  <title>Esku</title>
  <defs>
    <linearGradient id="esku-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#esku-bg)"/>

  <!--
    A still open palm is a handshape, not a sign; what makes it a sign is the movement. Hence the
    trail: it buys the whole difference for one extra shape, which is all a 16 px tile affords.

    The hand itself is anatomical rather than legible-at-any-cost: four fingers on a knuckle arc,
    each its own length, splayed so the gaps open towards the tips, and a palm drawn as one curve
    that widens at the knuckles and narrows to the heel. The thumb runs 50 units past its pivot so
    it stays buried in the palm — any deeper and its cap breaks back out through the heel.

    Everything sits inside 113..400 x 132..406, well within the Android maskable safe zone (51..461).
  -->
  <g fill="#FFFFFF">
    <path d="M128 147 C78 207 76 313 126 381" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <path d="M194 187 C162 231 161 305 192 347" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.45"/>

    <g transform="translate(270 255) rotate(-6) scale(0.8) translate(-230 -258.5)">
      <path d="M162 276 C226 264 296 270 352 284 C376 290 380 326 368 360 C354 402 314 430 264 430 C222 432 186 420 172 396 C160 374 150 336 154 306 C157 288 156 278 162 276 Z"/>
      <rect x="154" y="112" width="48" height="190" rx="24" transform="rotate(-8 178 262)"/>
      <rect x="205" y="84" width="50" height="210" rx="25" transform="rotate(-2 230 254)"/>
      <rect x="258" y="102" width="48" height="196" rx="24" transform="rotate(6 282 258)"/>
      <rect x="309" y="150" width="42" height="164" rx="21" transform="rotate(15 330 274)"/>
      <rect x="167" y="254" width="54" height="158" rx="27" transform="rotate(-55 194 362)"/>
    </g>
  </g>
</svg>
