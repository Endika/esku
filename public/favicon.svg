<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Esku">
  <title>Esku</title>
  <defs>
    <linearGradient id="esku-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#esku-bg)"/>

  <!--
    A hand read as a waveform, because the hand is the voice, over two lines of text: what
    comes out the other side.

    Three fingers rather than four, and every bar half again as wide. At 32 px this artwork
    gets about ten usable pixels across: four 54-wide fingers with 20-wide gaps collapsed
    into one smear, and the 28-tall text lines disappeared outright. Fewer, fatter shapes
    survive the size the icon is actually seen at.
  -->
  <g fill="#FFFFFF">
    <rect x="176" y="120" width="68" height="210" rx="34"/>
    <rect x="260" y="84" width="68" height="246" rx="34"/>
    <rect x="344" y="136" width="68" height="194" rx="34"/>

    <!-- Thumb, angled off the palm so the silhouette reads as a hand and not a bar chart. -->
    <rect x="92" y="192" width="64" height="152" rx="32" transform="rotate(-34 124 268)"/>

    <rect x="176" y="368" width="236" height="40" rx="20"/>
    <rect x="176" y="424" width="140" height="40" rx="20" fill-opacity="0.6"/>
  </g>
</svg>
